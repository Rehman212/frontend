name: Frontend automation

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          # next build (compile + TypeScript) on EC2 often exceeds default 10m
          command_timeout: 30m
          script: |
            set -e
            cd ~/app/frontend

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            docker compose down
            docker compose up -d --build --remove-orphans

            docker image prune -f
